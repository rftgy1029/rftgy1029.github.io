<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생활 계산기 모음 | 알바 급여 계산기</title>
  <meta name="description" content="알바 급여, 주휴수당, 야간수당, 실수령액을 쉽게 계산하는 무료 계산기 모음입니다.">
  <link rel="canonical" href="https://rftgy1029.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rftgy1029.github.io/">
  <meta property="og:title" content="생활 계산기 모음">
  <meta property="og:description" content="알바 급여, 주휴수당, 야간수당, 실수령액을 쉽게 계산하는 무료 계산기 모음">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // 계산기에서 고른 테마(같은 주소라 저장값을 함께 쓴다)를 화면을 그리기 전에 적용한다.
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <style>
    :root {
      --bg: #f5f7f6;
      --surface: #ffffff;
      --text: #19201d;
      --muted: #5b6662;
      --border: #d4dcd8;
      --accent: #2e7d6b;
      --accent-soft: #e2f1ec;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1312;
        --surface: #171d1b;
        --text: #e5ebe8;
        --muted: #9aa6a1;
        --border: #2b3431;
        --accent: #6fcfb6;
        --accent-soft: #1b322c;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1312;
      --surface: #171d1b;
      --text: #e5ebe8;
      --muted: #9aa6a1;
      --border: #2b3431;
      --accent: #6fcfb6;
      --accent-soft: #1b322c;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
        "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      line-height: 1.3;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .calculators {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .calc-link {
      display: block;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
    }

    .calc-link:hover {
      border-color: var(--accent);
    }

    .calc-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .calc-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 4px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .calc-title::after {
      color: var(--accent);
      content: "→";
    }

    .calc-desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .soon {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>생활 계산기 모음</h1>
    <p class="lead">복잡한 급여 계산을 쉽고 정확하게. 모두 무료로 쓸 수 있어요.</p>

    <ul class="calculators">
      <li>
        <a class="calc-link" href="/alba-pay-calculator/">
          <p class="calc-title">알바 급여 계산기</p>
          <p class="calc-desc">2026·2027년 최저시급 기준으로 주휴수당, 야간수당, 연장수당과 4대보험·3.3% 공제 후 실수령액까지 계산해요.</p>
        </a>
      </li>
      <li class="soon">연차·퇴직금 계산기는 준비 중이에요.</li>
    </ul>

    <footer class="footer">
      <p>계산 결과는 참고용이며, 실제 급여는 근로계약과 사업장 상황에 따라 달라질 수 있어요.</p>
    </footer>
  </main>
</body>
</html>
